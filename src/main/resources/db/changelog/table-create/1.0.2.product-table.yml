databaseChangeLog:
  - changeSet:
      id: create-tables-product
      author: ShLF
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: barcode
                  type: VARCHAR(30)
                  constraints:
                    unique: true
              - column:
                  name: price
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: stock_quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: category_id
                  type: BIGINT
