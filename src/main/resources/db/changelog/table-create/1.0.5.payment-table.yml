databaseChangeLog:
  - changeSet:
      id: create-tables-payment
      author: ShLF
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: method
                  type: VARCHAR(30)
              - column:
                  name: status
                  type: VARCHAR(30)
              - column:
                  name: payment_date
                  type: TIMESTAMP
              - column:
                  name: transaction_id
                  type: VARCHAR(100)
                  constraints:
                    unique: true
              - column:
                  name: branch_id
                  type: VARCHAR(50)
              - column:
                  name: cash_register_id
                  type: VARCHAR(50)